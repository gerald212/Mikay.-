<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #30102c, #100817 70%);
      color: white;
      font-family: Arial, sans-serif;
    }
    .scene { text-align: center; padding: 24px; }
    canvas { width: min(90vw, 440px); height: min(75vw, 440px); display: block; }
    h1 { margin: 8px 0 0; font-size: clamp(22px, 5vw, 32px); }
    p { margin: 8px 0 0; color: #f5bfdc; }
  </style>
</head>
<body>
  <main class="scene">
    <canvas id="heart" width="500" height="500" aria-label="An animated red heart"></canvas>
    <h1>Made with love ❤️</h1>
    <p>A little heart animation</p>
  </main>
  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");
    let pulse = 0;

    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t) - Math.cos(4*t);
      return { x: 250 + x * scale, y: 245 - y * scale };
    }

    function drawHeart(scale) {
      ctx.beginPath();
      for (let i = 0; i <= 400; i++) {
        const t = (i / 400) * Math.PI * 2;
        const p = heartPoint(t, scale);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();

      const gradient = ctx.createLinearGradient(130, 120, 370, 390);
      gradient.addColorStop(0, "#ff8ab5");
      gradient.addColorStop(0.48, "#ff174f");
      gradient.addColorStop(1, "#a90035");
      ctx.fillStyle = gradient;
      ctx.shadowColor = "#ff276f";
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = "#ffd1e1";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scale = 10.5 + Math.sin(pulse) * 0.45;
      drawHeart(scale);
      pulse += 0.055;
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
